name: Build APK

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# GitHub-hosted Ubuntu runners already ship a full Android SDK at this location.
# We use it directly instead of relying on an external SDK-setup action.
env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  build:
    name: Assemble debug + release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          if [ ! -d "$ANDROID_HOME" ]; then
            echo "::error::Android SDK not found at $ANDROID_HOME"
            exit 1
          fi
          SDKMANAGER="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          echo "sdkmanager=$SDKMANAGER"
          if [ -n "$SDKMANAGER" ]; then
            # Licences are usually pre-accepted on hosted runners; ignore failures here and
            # let AGP's own SDK downloader fetch whatever is missing.
            (yes | "$SDKMANAGER" --licenses >/dev/null 2>&1) || true
            "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" 2>&1 | tail -5 || true
          fi
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ls "$ANDROID_HOME/platforms" 2>/dev/null || true
          java -version

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests + assemble debug & release
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace --console=plain \
            testDebugUnitTest assembleDebug assembleRelease 2>&1 | tee build.log

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ShakeFlash-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ShakeFlash-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish failure details
        if: failure()
        run: |
          if [ ! -f build.log ]; then
            echo "::error title=Gradle output::build.log missing - failure happened before Gradle ran"
            exit 0
          fi

          echo "===== Gradle failure summary ====="
          awk '/^FAILURE: Build failed/,/^\* Try/' build.log | head -40 || true
          echo "===== compiler / resolution errors ====="
          grep -nE "^(e|w): |^error:|Caused by:|Could not |Unsupported |SDK location|AAPT|Execution failed|> " build.log | head -60 || true
          echo "===== tail ====="
          tail -n 30 build.log

          # Raw logs are not reachable from some environments, but annotations are.
          {
            awk '/^FAILURE: Build failed/,/^\* Try/' build.log | head -12
            grep -E "^(e|w): |^error:|Caused by:|Could not |Unsupported |SDK location|AAPT|Execution failed for task" build.log | head -28
          } | sed -e 's/\r//g' -e 's/%/%25/g' | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error title=Gradle ::$line"
          done

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload unit-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore
